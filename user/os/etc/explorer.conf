# /etc/explorer.conf -- what the explorer opens each file with (docs/explorer.md).
#
# One rule a line, `command = pattern`. The command is what you would type at
# the prompt, and the file you clicked is added to the end of it. The first
# line whose pattern matches the name wins, so *.* goes last.
#
#   EXEC       run the file itself, as typing its name at the prompt does
#   .ext       a name ending in it, either case      *.*   every file

EXEC            = .bin
/bin/img.bin -s = .bmp
/bin/edit.bin   = *.*
