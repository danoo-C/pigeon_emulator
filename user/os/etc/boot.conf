# /etc/boot.conf -- what runs right after the kernel (docs/phase6_plan.md).
# Boot is strict: a mistake in this file stops it, and says where.
#
#   splash     a program shown first; it's given splash_ms as its argument
#   splash_ms  how long it shows, in milliseconds: 1 to 60000, 2500 if left out
#   startup    the program run next, and again whenever it ends

splash    = /bin/splash.bin
splash_ms = 30000
startup   = /bin/sh.bin
