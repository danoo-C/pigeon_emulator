<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Pigeon Display</title>
  <style>
    body { font-family: Arial, sans-serif; background: #222; color: #eee; display:flex; flex-direction:column; align-items:center; padding:16px }
    #controls { margin-bottom:8px }
    #hint { color:#888; font-size:12px; margin-top:8px }
    canvas:focus { outline:2px solid #4a90d9 }
    canvas { image-rendering: pixelated; border:1px solid #444 }
    button { margin-right:8px }
    button:disabled { opacity:.45; cursor:not-allowed }
    #cd { margin-top:8px }
    #cd-status { color:#888; font-size:12px; margin-left:4px }
    #cd-status.bad { color:#e08070 }
    #cd-list { margin-right:8px; max-width:22em }
  </style>
</head>
<body>
  <div id="controls">
    <button id="clear">Clear</button>
    <label>Scale: <input id="scale" type="number" value="4" min="1" max="16" /></label>
    <label><input id="running" type="checkbox" checked/> Live</label>
  </div>
  <div id="cd">
    <button id="cd-server">Load from server</button>
    <select id="cd-list" hidden></select>
    <button id="cd-pc">Load from PC</button>
    <!-- A browser cannot hand over a PATH: input.files[0] is bytes with a
         name and nothing else. So this button UPLOADS, while the pygame
         client sends a path from a native dialog. That asymmetry is the
         sandbox, not a design choice -- please don't "fix" it. -->
    <input id="cd-file" type="file" hidden />
    <button id="cd-eject">Eject</button>
    <span id="cd-status">no drive</span>
  </div>
  <canvas id="screen" tabindex="0"></canvas>
  <p id="hint">Click the canvas to give it focus, then use the mouse and keyboard.</p>

  <script>
    // ---- input -----------------------------------------------------------
    // The HID server is a separate port from the one serving this page; it
    // comes from /hidinfo so config.json stays the single source of truth.
    // Keycodes MUST be translated: the guest's key FIFO is one byte wide,
    // and the emulator rejects anything above 0xFF rather than truncating.
    // This table mirrors emulator/devices/keycodes.py -- tests/test_input.py
    // parses it and asserts the two agree.
    const KEYS = {
      ArrowLeft:0x80, ArrowRight:0x81, ArrowUp:0x82, ArrowDown:0x83,
      Home:0x84, End:0x85, PageUp:0x86, PageDown:0x87,
      Insert:0x88, Delete:0x7F, Backspace:0x08, Tab:0x09,
      Enter:0x0D, Escape:0x1B, ' ':0x20,
      ShiftLeft:0x89, ShiftRight:0x8A, ControlLeft:0x8B, ControlRight:0x8C,
      AltLeft:0x8D, AltRight:0x8E,
      F1:0x90, F2:0x91, F3:0x92, F4:0x93, F5:0x94, F6:0x95,
      F7:0x96, F8:0x97, F9:0x98, F10:0x99, F11:0x9A, F12:0x9B
    };

    function toPigeonKey(e){
      if (KEYS[e.code] !== undefined) return KEYS[e.code];
      if (KEYS[e.key]  !== undefined) return KEYS[e.key];
      if (e.key.length === 1){
        const c = e.key.charCodeAt(0);
        if (c >= 0x20 && c <= 0x7E) return c;   // printable ASCII passes through
      }
      return null;                               // drop, never truncate
    }

    let HID = null;

    // The CD drive's endpoints, on their own port, discovered from /info
    // the same way HID is. Deliberately NOT routed through post() below:
    // that queue exists to keep ordered input state in order, and putting
    // a disc in is neither ordered against a mouse move nor allowed to be
    // collapsed into one.
    let CD = null;

    const cdServerBtn = document.getElementById('cd-server');
    const cdPcBtn     = document.getElementById('cd-pc');
    const cdEjectBtn  = document.getElementById('cd-eject');
    const cdList      = document.getElementById('cd-list');
    const cdFile      = document.getElementById('cd-file');
    const cdStatus    = document.getElementById('cd-status');

    function fmtSize(n){
      if (n < 1024) return n + ' B';
      if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
      return (n / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function cdSay(text, bad){
      cdStatus.textContent = text;
      cdStatus.classList.toggle('bad', !!bad);
    }

    // 4xx from these endpoints carries FastAPI's {detail: "..."}, and the
    // detail is the whole point -- "outside cd_root" names the setting to
    // change. Losing it to a bare status code would make the 403 useless.
    async function cdCall(path, opts){
      const r = await fetch(CD + path, opts);
      const body = await r.json().catch(() => null);
      if (!r.ok) throw new Error((body && body.detail) || (r.status + ' ' + r.statusText));
      return body;
    }

    function cdShow(status){
      const present = !!(status && status.present);
      cdEjectBtn.disabled = !present;
      cdSay(present ? 'disc: ' + status.name + '  (' + fmtSize(status.size) + ')'
                    : 'no disc');
      return status;
    }

    async function cdRefresh(){
      try { cdShow(await cdCall('/cd/status')); }
      catch (e) { cdSay(e.message, true); }
    }

    function wireCD(){
      if (!CD){
        // An emulator built before the drive existed serves no cd_url.
        for (const b of [cdServerBtn, cdPcBtn, cdEjectBtn]) b.disabled = true;
        cdSay('no drive on this emulator');
        return;
      }

      cdServerBtn.addEventListener('click', async () => {
        try {
          const discs = await cdCall('/cd/list');
          cdList.innerHTML = '';
          if (!discs.length){
            cdList.hidden = true;
            cdSay('nothing in cd_dirs -- drop a file in cds/', true);
            return;
          }
          const first = document.createElement('option');
          first.textContent = 'pick a disc...';
          first.value = '';
          cdList.appendChild(first);
          for (const d of discs){
            const o = document.createElement('option');
            o.value = d.path;
            o.textContent = d.name + '  (' + fmtSize(d.size) + ')';
            cdList.appendChild(o);
          }
          cdList.hidden = false;
          cdList.focus();
        } catch (e) { cdSay(e.message, true); }
      });

      cdList.addEventListener('change', async () => {
        if (!cdList.value) return;
        try {
          cdShow(await cdCall('/cd/insert', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({path: cdList.value}),
          }));
          cdList.hidden = true;
        } catch (e) { cdSay(e.message, true); }
      });

      cdPcBtn.addEventListener('click', () => cdFile.click());

      cdFile.addEventListener('change', async () => {
        const file = cdFile.files && cdFile.files[0];
        if (!file) return;
        cdSay('uploading ' + file.name + '...');
        try {
          // The File goes as the raw body. Not multipart: UploadFile would
          // need python-multipart on the emulator side, and this is less
          // work at both ends.
          cdShow(await cdCall('/cd/upload?name=' + encodeURIComponent(file.name), {
            method: 'POST',
            headers: {'Content-Type': 'application/octet-stream'},
            body: file,
          }));
        } catch (e) { cdSay(e.message, true); }
        cdFile.value = '';            // so the same file can be picked again
      });

      cdEjectBtn.addEventListener('click', async () => {
        try { cdShow(await cdCall('/cd/eject', {method: 'POST'})); }
        catch (e) { cdSay(e.message, true); }
      });

      cdRefresh();
      // The pygame client can work the same drive, so this page is not the
      // only thing that changes what is in it. A poll every two seconds is
      // nothing next to the frame fetch and keeps the two front ends from
      // disagreeing about what is loaded.
      setInterval(() => { if (!document.hidden) cdRefresh(); }, 2000);
    }

    // Every update posted from here is ORDERED STATE, and fetch() does not
    // preserve order: nothing stops several POSTs being in flight at once,
    // and they complete in whatever sequence the network and the event loop
    // happen to produce. A stale /mouse_pos landing after a fresh one -- or
    // after the /mouse_event press it belongs with -- is invisible on the
    // wire but not in the guest, which reads a drag as the DIFFERENCE
    // between successive positions. One reordered packet is therefore one
    // jump across the screen.
    //
    // So: one request in flight, with a queue behind it. The pygame client
    // gets this for free by posting synchronously from its event loop; here
    // it has to be built, which is why dragging glitched in the browser and
    // not in the window.
    //
    // Consecutive position updates collapse into the newest, because only
    // the latest position means anything and a fast drag would otherwise
    // build a backlog that arrives after the gesture is over. Button and key
    // edges are NEVER collapsed -- each is a discrete event the guest has to
    // see, and two of them in a row are not the same as one.
    const outbox = [];
    let sending = false;

    function post(path, body){
      if (!HID) return;
      const last = outbox[outbox.length - 1];
      if (path === '/mouse_pos' && last && last.path === '/mouse_pos') last.body = body;
      else outbox.push({path, body});
      drain();
    }

    function drain(){
      if (sending || !outbox.length) return;
      sending = true;
      const next = outbox.shift();
      fetch(HID + next.path, {method:'POST', headers:{'Content-Type':'application/json'},
                              body: JSON.stringify(next.body)})
        .catch(()=>{})
        .finally(()=>{ sending = false; drain(); });
    }

    // No default geometry on purpose. /info is the only source of it,
    // and guessing wrong is invisible: every frame then fails the
    // length check below and is dropped, so the screen just stays
    // blank with nothing logged. A stale 64x64 guess sat here through
    // two resolution changes doing exactly that.
    let W=0, H=0;
    const canvas = document.getElementById('screen');
    const ctx = canvas.getContext('2d');
    const clearBtn = document.getElementById('clear');
    const scaleInput = document.getElementById('scale');
    const runningBox = document.getElementById('running');

    const off = document.createElement('canvas');
    const offctx = off.getContext('2d');

    async function init(){
      try{
        const info = await fetch('/info').then(r=>r.json());
        W = info.w; H = info.h;
        if (info.hid_url) HID = info.hid_url;
        if (info.cd_url) CD = info.cd_url;
      }catch(e){
        document.body.textContent =
          'Cannot reach the emulator: /info failed. Is it running?';
        throw e;                      // stop, rather than render a guess
      }
      wireInput();
      wireCD();
      off.width = W; off.height = H;
      canvas.width = W * Number(scaleInput.value || 4);
      canvas.height = H * Number(scaleInput.value || 4);
      loop();
    }

    scaleInput.addEventListener('change', ()=>{
      canvas.width = W * Number(scaleInput.value || 4);
      canvas.height = H * Number(scaleInput.value || 4);
    });

    clearBtn.addEventListener('click', async ()=>{
      await fetch('/clear', {method:'POST'}).catch(()=>{});
    });

    let fetching = false;
    async function loop(){
      if (!runningBox.checked){ setTimeout(loop, 200); return; }
      if (fetching){ setTimeout(loop, 10); return; }
      fetching = true;
      try{
        const resp = await fetch('/frame');
        if (!resp.ok) throw new Error('bad');
        const buf = await resp.arrayBuffer();
        const arr = new Uint8ClampedArray(buf);
        if (arr.length !== W*H*4){
          console.warn(`frame is ${arr.length} bytes, expected ${W*H*4} `
                       + `for ${W}x${H} -- dropping it`);
        } else {
          const img = new ImageData(arr, W, H);
          offctx.putImageData(img, 0, 0);
          ctx.imageSmoothingEnabled = false;
          ctx.clearRect(0,0,canvas.width, canvas.height);
          ctx.drawImage(off, 0, 0, canvas.width, canvas.height);
        }
      }catch(e){ /* ignore */ }
      fetching = false;
      setTimeout(loop, 66); // ~15 FPS
    }

    // Translate a browser event into display pixel coordinates. The canvas
    // is upscaled, so divide by the real scale rather than the input box --
    // they differ while the box is mid-edit.
    function toDisplayXY(e){
      const r = canvas.getBoundingClientRect();
      const x = Math.floor((e.clientX - r.left) / (r.width  / W));
      const y = Math.floor((e.clientY - r.top ) / (r.height / H));
      return {x: Math.max(0, Math.min(W-1, x)), y: Math.max(0, Math.min(H-1, y))};
    }

    function wireInput(){
      // Browser button 0/1/2 = left/middle/right; HID wants 0/1/2 = left/right/middle.
      const BTN = {0:0, 1:2, 2:1};
      let held = 0;               // bitmask of buttons currently down

      function overCanvas(e){
        const r = canvas.getBoundingClientRect();
        return e.clientX >= r.left && e.clientX < r.right &&
               e.clientY >= r.top  && e.clientY < r.bottom;
      }

      // Bound to the window rather than the canvas, but only acted on while
      // a button is held or the pointer is actually over the screen. A
      // canvas-only listener stops firing the moment a drag wanders off the
      // edge, so the guest sees the pointer freeze and then jump when it
      // comes back. toDisplayXY clamps, so an off-canvas drag pins to the
      // edge instead -- which is what dragging past the edge should do.
      //
      // No rate limit: the outbox already collapses consecutive positions,
      // so the send rate is bounded by the round trip and every position
      // that goes out is the newest one. The 33 ms throttle this replaces
      // did the opposite -- it held the newest position back for up to a
      // frame, which is how a stale position ended up under a click.
      window.addEventListener('mousemove', e => {
        if (held || overCanvas(e)) post('/mouse_pos', toDisplayXY(e));
      });

      // The position goes first, and through the same queue, so the guest
      // knows where the pointer was when the button moved. mousedown carried
      // no position at all before, which left a press anchored to whatever
      // the last throttled mousemove had reported -- up to a frame of travel
      // away, and the whole of that gap turned into the first drag delta.
      canvas.addEventListener('mousedown', e => {
        canvas.focus();
        if (BTN[e.button] === undefined) return;
        held |= 1 << e.button;
        post('/mouse_pos', toDisplayXY(e));
        post('/mouse_event', {button: BTN[e.button], pressed: true});
      });
      window.addEventListener('mouseup', e => {
        if (BTN[e.button] === undefined) return;
        held &= ~(1 << e.button);
        post('/mouse_pos', toDisplayXY(e));
        post('/mouse_event', {button: BTN[e.button], pressed: false});
      });
      canvas.addEventListener('contextmenu', e => e.preventDefault());

      canvas.addEventListener('keydown', e => {
        const c = toPigeonKey(e);
        if (c !== null){ post('/key', {code:c, pressed:true}); e.preventDefault(); }
      });
      canvas.addEventListener('keyup', e => {
        const c = toPigeonKey(e);
        if (c !== null){ post('/key', {code:c, pressed:false}); e.preventDefault(); }
      });
      // Losing focus with keys held would leave them stuck down in the
      // guest's state bitmap forever, so release everything on blur.
      canvas.addEventListener('blur', () => {
        for (const code of new Set(Object.values(KEYS))) post('/key', {code, pressed:false});
      });
    }

    init();
  </script>
</body>
</html>
